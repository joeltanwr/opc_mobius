:root{
  --red:#ED1C24; --red-h:#D0121A; --red-d:#A60E14;
  --navy:#1A202C; --slate:#1E293B;
  --bg:#F4F5F7; --card:#fff; --line:#E2E8F0; --line-d:#CBD5E1;
  --t1:#0F172A; --t2:#64748B; --t3:#94A3B8;
  --ok:#10B981; --ok-bg:#ECFDF5; --warn:#F59E0B; --warn-bg:#FEF3C7;
  --info:#2563EB; --info-bg:#EFF6FF; --indigo:#6366F1;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 "Open Sans","Helvetica Neue",Arial,sans-serif;color:var(--t1);background:var(--bg);-webkit-font-smoothing:antialiased}
h1{font-size:28px;font-weight:700;line-height:1.25}
h2{font-size:20px;font-weight:600;line-height:1.3}
h3{font-size:16px;font-weight:600;line-height:1.4}
.mono{font-variant-numeric:tabular-nums;font-family:Inter,system-ui,sans-serif}
.cap{font-size:12.5px;color:var(--t2);line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}
.sec{padding:32px 0}
button{font-family:inherit;font-size:14px;cursor:pointer;border-radius:8px;border:0}
.btn{padding:10px 18px;font-weight:600;transition:.15s}
.btn-p{background:var(--red);color:#fff}.btn-p:hover{background:var(--red-h)}
.btn-p:disabled{background:var(--line-d);cursor:not-allowed}
.btn-s{background:#fff;color:var(--slate);border:1px solid var(--line-d)}
.btn-s:hover{background:#F8FAFC;border-color:var(--t3)}
.btn-lg{padding:14px 26px;font-size:15px}
.btn-dark{background:var(--slate);color:#fff}.btn-dark:hover{background:var(--navy)}

/* ── shell ── */
.topbar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:60}
.topbar .wrap{display:flex;align-items:center;gap:28px;height:60px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;letter-spacing:-.3px}
.loop{width:26px;height:16px;flex:none}
.roles{display:flex;gap:2px;background:rgba(255,255,255,.08);padding:3px;border-radius:9px;margin-left:auto}
.roles button{padding:7px 15px;background:transparent;color:#CBD5E1;font-weight:600;font-size:13px;border-radius:6px}
.roles button.on{background:var(--red);color:#fff}
.clock{font-size:12px;color:#94A3B8;padding-left:20px;border-left:1px solid rgba(255,255,255,.15)}
.rolebar{background:#fff;border-bottom:1px solid var(--line)}
.rolebar .wrap{display:flex;align-items:center;gap:4px;height:52px;overflow-x:auto}
.rolebar button{padding:8px 15px;background:transparent;color:var(--t2);font-weight:600;font-size:13.5px;white-space:nowrap}
.rolebar button.on{background:#F1F5F9;color:var(--red)}
.rolebar button:disabled{color:var(--t3);cursor:not-allowed}
.ctx{margin-left:auto;font-size:12.5px;color:var(--t2);white-space:nowrap}

/* ── cards ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;
  box-shadow:0 1px 3px rgba(0,0,0,.05),0 1px 2px -1px rgba(0,0,0,.05)}
.card+.card{margin-top:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.split{display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi .v{font-size:27px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--t2);margin-top:2px}
.kpi .n{font-size:11.5px;color:var(--t3);margin-top:6px}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px}
.p-ok{background:var(--ok-bg);color:#047857}.p-warn{background:var(--warn-bg);color:#92400E}
.p-info{background:var(--info-bg);color:#1D4ED8}.p-red{background:#FEF2F2;color:#B91C1C}
.p-grey{background:#F1F5F9;color:var(--t2)}
.skill{display:inline-flex;align-items:center;gap:6px;background:#F5F3FF;border:1px solid #DDD6FE;
  color:#5B21B6;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:6px;font-family:Inter,monospace}
.flag{background:var(--warn-bg);border-left:3px solid var(--warn);padding:11px 14px;border-radius:0 8px 8px 0;font-size:13px;line-height:1.5}
.note{background:var(--info-bg);border-left:3px solid var(--info);padding:11px 14px;border-radius:0 8px 8px 0;font-size:13px;line-height:1.5}
.internal{background:#FEF2F2;border:1px dashed #FCA5A5;border-radius:8px;padding:9px 13px;font-size:12px;color:#B91C1C;font-weight:600}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--t2);
  padding:9px 10px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:11px 10px;border-bottom:1px solid #F1F5F9;vertical-align:top}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* ── charts ── */
.hbars{display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:8px}
.hbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.hbar i{width:100%;background:#CBD5E1;border-radius:3px 3px 0 0;display:block}
.hbar.gap i{background:var(--red)}
.hbar.peak i{background:var(--slate)}
.hbar b{font-size:10px;color:var(--t3);font-weight:600}
.sbar{height:9px;background:#F1F5F9;border-radius:5px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--red);border-radius:5px}
.stack{display:flex;height:26px;border-radius:6px;overflow:hidden;font-size:10.5px;color:#fff;font-weight:700}
.stack div{display:flex;align-items:center;justify-content:center;min-width:0}
.rowlab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.rowlab b{font-variant-numeric:tabular-nums}

/* ── rank list ── */
.rank{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid #F1F5F9}
.rank:last-child{border-bottom:0}
.rank .n{width:26px;height:26px;border-radius:7px;background:#F1F5F9;color:var(--t2);
  display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.rank.top .n{background:var(--red);color:#fff}
.rank.dim{opacity:.6}

/* ── form ── */
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px;color:var(--slate)}
.field .h{font-size:12px;color:var(--t2);margin-bottom:6px;line-height:1.45}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:9px 12px;border:1px solid var(--line-d);border-radius:8px;font:14px/1.4 inherit;color:var(--t1);background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #FCA5A5;outline-offset:-1px;border-color:var(--red)}
input[readonly]{background:#F8FAFC;color:var(--t2)}
input[type=range]{width:100%;accent-color:var(--red)}
.locked{background:#F8FAFC;border:1px solid var(--line);border-radius:8px;padding:13px 15px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--line-d);background:#fff;font-size:12.5px;font-weight:600;color:var(--slate)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.seg2{display:flex;gap:6px;flex-wrap:wrap}
.seg2 button{padding:8px 14px;border:1px solid var(--line-d);background:#fff;font-weight:600;font-size:13px;color:var(--slate)}
.seg2 button.on{background:var(--slate);color:#fff;border-color:var(--slate)}

/* ── phone ── */
.phone{width:332px;background:#0F172A;border-radius:34px;padding:11px;box-shadow:0 20px 40px rgba(0,0,0,.22);margin:0 auto}
.screen{background:#F4F5F7;border-radius:25px;overflow:hidden;height:610px;display:flex;flex-direction:column;position:relative}
.sbar2{background:#fff;padding:9px 18px 5px;display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--t1)}
.apphd{background:#fff;padding:9px 18px 14px;border-bottom:1px solid var(--line)}
.apphd h4{font-size:17px;font-weight:700}
.scroll{flex:1;overflow-y:auto;padding:14px}
.toast{position:absolute;top:12px;left:10px;right:10px;background:rgba(255,255,255,.98);backdrop-filter:blur(8px);
  border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:5;
  animation:drop .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes drop{from{transform:translateY(-130%);opacity:0}to{transform:translateY(0);opacity:1}}
.toast .th{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--red);margin-bottom:4px}
.toast .tt{font-size:13.5px;font-weight:700;line-height:1.3}
.toast .tb{font-size:12.5px;color:var(--t2);margin-top:2px;line-height:1.4}
.offer{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px}
.offer .band{background:linear-gradient(135deg,var(--red),var(--red-d));color:#fff;padding:16px}
.offer .band .big{font-size:30px;font-weight:800;letter-spacing:-1px}
.offer .body{padding:14px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--red);display:inline-block}

/* ── allocator run ── */
.funnel{display:flex;flex-direction:column;gap:2px}
.fstep{display:flex;align-items:center;gap:14px;padding:13px 16px;background:#fff;border:1px solid var(--line);
  border-radius:9px;opacity:.28;transition:.3s}
.fstep.on{opacity:1;border-color:var(--line-d)}
.fstep.on.cut{background:#FFFBF5;border-color:#FDE68A}
.fstep .ix{width:25px;height:25px;border-radius:7px;background:#F1F5F9;display:grid;place-items:center;
  font-size:12px;font-weight:700;color:var(--t2);flex:none}
.fstep.on .ix{background:var(--slate);color:#fff}
.fstep .txt{flex:1;min-width:0}
.fstep .txt b{font-size:13.5px}
.fstep .txt span{display:block;font-size:12px;color:var(--t2);margin-top:1px}
.fstep .ct{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.fstep .dl{font-size:12px;color:#B45309;font-weight:700;width:62px;text-align:right;font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:100;display:grid;place-items:center;padding:24px}
.modal .box{background:#fff;border-radius:14px;padding:26px;max-width:740px;width:100%;max-height:88vh;overflow-y:auto}
.hide{display:none!important}
@media(max-width:1100px){.split{grid-template-columns:1fr}.g4,.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
</style>
</head>

const NAV = {
  merchant:[['profile','1 · Customer profile'],['rec','2 · Recommended programme'],
            ['config','3 · Reward configuration'],['dash','4 · Reward dashboard']],
  rm:[['portfolio','Portfolio dashboard'],['run','Allocation run'],['tagging','Cardholder tagging batch']],
  cust:[['app','OCBC app']]
};
const CTX = {merchant:'M0001 · Tanjong Pagar Cafe · OCBC Velocity',
             rm:'Shannon Lim · EmB relationship manager · 34 merchants',
             cust:'Demo device — switch cardholder below'};

const $ = s => document.querySelector(s);
const n = v => Number(v).toLocaleString();
const sum = o => Object.values(o).reduce((a,b)=>a+b,0);

function go(view){ S.view=view; render(); window.scrollTo(0,0); }
function setRole(r){ S.role=r; S.view=NAV[r][0][0]; render(); window.scrollTo(0,0); }

/* ═══════════════ render ═══════════════ */
function render(){
  $('#clock').textContent = D.meta.demo_now + ' · demo clock';
  document.querySelectorAll('.roles button').forEach(b=>b.classList.toggle('on',b.dataset.role===S.role));
  $('#subnav').innerHTML = NAV[S.role].map(([k,l])=>{
    const dis = S.role==='merchant' && ((k==='config'&&!S.signedUp)||(k==='dash'&&!S.live));
    return `<button data-v="${k}" class="${S.view===k?'on':''}" ${dis?'disabled':''}>${l}</button>`;
  }).join('') + `<span class="ctx">${CTX[S.role]}</span>`;
  $('#app').innerHTML = ({
    profile:vProfile, rec:vRec, config:vConfig, dash:vDash,
    portfolio:vPortfolio, run:vRun, tagging:vTagging, app:vApp
  })[S.view]();
  bind();
}

function bind(){
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>!b.disabled&&go(b.dataset.v));
  document.querySelectorAll('.roles button').forEach(b=>b.onclick=()=>setRole(b.dataset.role));
  document.querySelectorAll('[data-cust]').forEach(b=>b.onclick=()=>{S.cust=b.dataset.cust;render()});
  document.querySelectorAll('[data-cfg]').forEach(el=>{
    el.oninput = ()=>{ const k=el.dataset.cfg;
      S.cfg[k] = el.type==='checkbox'?el.checked:(el.type==='range'||el.type==='number'?+el.value:el.value);
      if(['cap','pct','narrow','acq','from','to','days'].includes(k)) render(); };
  });
  const s=$('#signup'); if(s) s.onclick=()=>{S.signedUp=true;go('config')};
  const a=$('#activate'); if(a) a.onclick=()=>{S.live=true;go('dash')};
  const t=$('#trigger'); if(t) t.onclick=runAllocator;
  const k=$('#kill'); if(k) k.onclick=()=>{S.killed=!S.killed;render()};
}

/* ═══════════════ allocator run ═══════════════ */
function runAllocator(){
  const a=D.allocation, c=S.cfg;
  const steps=[
    {t:'Segment pool',s:'OCBC cardholders with history here, in the selected RFM segments',v:a.retention.pool},
    {t:'Narrowing filter',s:'≥10% of visits already in the gap window',v:a.retention.after_narrow,d:a.retention.narrow_removed,cut:1},
    {t:'Marketing consent',s:'No valid opt-in on file',v:a.retention.after_narrow-a.retention.consent_removed,d:a.retention.consent_removed,cut:1},
    {t:'Portfolio frequency cap',s:`Already holding ${a.freq_cap} offers this fortnight from other merchants`,v:a.retention.eligible,d:a.retention.cap_removed,cut:1},
    {t:'Acquisition pool',s:'Lookalike prospects, consent and dormancy applied',v:a.acquisition.final,add:1},
    {t:'Reach cap',s:`Merchant cap of ${n(c.cap)}`,v:Math.min(c.cap,a.total)},
  ];
  $('#modal').innerHTML=`<div class="modal"><div class="box">
    <div class="hd"><div><h2>Running /portfolio-allocator</h2>
      <p class="cap">Live against the portfolio as at ${D.meta.demo_now}</p></div>
      <span class="skill">/portfolio-allocator</span></div>
    <div class="funnel" id="fn">${steps.map((s,i)=>`
      <div class="fstep ${s.cut?'cut':''}" id="f${i}">
        <div class="ix">${i+1}</div>
        <div class="txt"><b>${s.t}</b><span>${s.s}</span></div>
        ${s.d?`<div class="dl">−${n(s.d)}</div>`:s.add?`<div class="dl" style="color:#047857">+${n(s.v)}</div>`:'<div class="dl"></div>'}
        <div class="ct">${n(s.v)}</div></div>`).join('')}</div>
    <div id="done" class="hide"></div></div></div>`;
  steps.forEach((s,i)=>setTimeout(()=>{
    document.getElementById('f'+i).classList.add('on');
    if(i===steps.length-1) setTimeout(finish,520);
  },i*560));

  function finish(){
    S.triggered=true;
    $('#done').className='';
    $('#done').innerHTML=`
      <div class="card" style="margin-top:18px;border-color:var(--ok);background:var(--ok-bg)">
        <h3 style="margin-bottom:6px">${n(Math.min(c.cap,a.total))} notifications sent</h3>
        <p class="cap">Delivered to the in-app offer feed, with a push notification for the segments above the
        relevance threshold. ${n(a.retention.narrow_removed+a.retention.consent_removed+a.retention.cap_removed)} people were
        removed by the filters and received nothing.</p></div>
      <div class="internal" style="margin-top:12px">The per-customer send list stays on the OCBC side.
        Tanjong Pagar Cafe sees the counts on this screen and never the identities behind them.</div>
      <div style="display:flex;gap:9px;margin-top:18px">
        <button class="btn btn-p" onclick="closeModal();setRole('cust')">Open customer view →</button>
        <button class="btn btn-s" onclick="closeModal();go('run')">Full allocation log</button>
        <button class="btn btn-s" onclick="closeModal()">Close</button></div>`;
  }
}
function closeModal(){ $('#modal').innerHTML=''; render(); }

    <tr><td>Distribution cutoff — 10th percentile</td><td class="num mono">${t.p10_cutoff} txns/month</td></tr>
    <tr style="font-weight:700"><td>Threshold applied — the lower of the two</td><td class="num mono">${t.threshold_used} txns/month</td></tr></table>
    <div class="flag" style="margin-top:12px">Read as <b>min(10, p10)</b> used as one threshold, not as "below 10 <b>or</b>

  <div class="card"><h3 style="margin-bottom:12px">Tags produced per cardholder</h3>
    <table><thead><tr><th>Tag</th><th>Basis</th><th>Used by the allocator for</th></tr></thead><tbody>

    </tbody></table></div>

  <div class="card" style="border-color:var(--warn);background:#FFFDF7">
    <h3 style="margin-bottom:8px">Considered and left out</h3>

  </div>`;
}
